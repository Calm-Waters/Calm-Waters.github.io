<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LimitlessSocks.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
    <style>
        :root {
            --background: #314933;
            --text-color: #F1FFFA;
            --link-color: #FE5F55;
            --link-color-highlight: #FEA09A;
        }
        * {
            font-family: "Atkinson Hyperlegible Next", serif;
        }
        html {
            background-color: var(--background);
            color: var(--text-color);
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
        }
        main {
            text-align: center;
        }
        a, a:visited {
            color: var(--link-color);
        }
        a:hover {
            color: var(--link-color-highlight);
        }
        h1, h2 {
            margin-bottom: 0;
        }
        h2 {
            border-bottom: 1px solid var(--link-color);
            padding-bottom: 5px;
            font-style: italic;
        }
        p {
            margin: 1.3em;
        }
    </style>
</head>
<body>
    <main>
        <p><a href="https://calm-waters.github.io/EXU-Scrape/">EXU</a>, a custom Yu-Gi-Oh! format and card viewer.</p>
    </main>
</body>
</html>
